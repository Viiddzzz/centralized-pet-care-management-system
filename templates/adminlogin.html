{% extends 'commonheader.html'  %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
{% block content %}
<body style="background-image: url('https://img.freepik.com/free-vector/modern-abstract-white-minimal-background_84443-8318.jpg?semt=ais_hybrid&w=740&q=80');">
  <main class="main">
<!-- Page Title -->
    <div class="page-title light-background" style="background: none;">
      <div class="container d-lg-flex justify-content-between align-items-center"  style="background: none;">
        <h1 class="mb-2 mb-lg-0">Admin Login</h1>
        <nav class="breadcrumbs">
          <ol>
            <li><a href="/index">Home</a></li>
            <li class="current">Admin Login</li>
          </ol>
        </nav>
      </div>
    </div><!-- End Page Title -->
    <!-- Contact Section -->
    <section id="contact" class="contact section"  style="background-image: url('https://img.freepik.com/free-vector/modern-abstract-white-minimal-background_84443-8318.jpg?semt=ais_hybrid&w=740&q=80');">

      <div class="container" data-aos="fade-up" data-aos-delay="100">


        <div class="row gy-4">

          <div class="col-lg-8">
            <form action="/adminlogin" method="post" data-aos="fade-up" data-aos-delay="200">
              <div class="row gy-4">

                <div class="col-md-12">
                  {{msg}}
                </div>

                <div class="col-md-12">
                  <input type="text" name="uname" class="form-control" placeholder="Login Name" required=""
                  style="width:300px;">
                </div>

                <div class="col-md-12">
                  <input type="password" class="form-control" name="pwd" placeholder="Password" required=""
                  style="width:300px;">
                </div>

                <div class="col-md-12">
                  <br>
                  <button type="submit">Admin Login</button>
                </div>

              </div>
            </form>
          </div><!-- End Contact Form -->

        </div>

      </div>

    </section><!-- /Contact Section -->

      </main>
</body>
{% endblock %}
</html>
